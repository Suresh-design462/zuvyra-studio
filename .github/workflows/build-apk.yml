name: Build ZUVYRA APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode debug signing keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Build signed Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare ZUVYRA.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk ZUVYRA.apk

      - name: Upload ZUVYRA.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZUVYRA-apk
          path: ZUVYRA.apk
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest ZUVYRA.apk --clobber
          else
            gh release create latest ZUVYRA.apk \
              --title "ZUVYRA Direct APK" \
              --notes "100% Offline Studio Build — tap ZUVYRA.apk under Assets to download and install directly on Android 13+."
          fi
